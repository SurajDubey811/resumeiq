services:
  resumeiq:
    build:
      context: .
      dockerfile: Dockerfile
    image: resumeiq:latest
    container_name: resumeiq_app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - APP_NAME=ResumeIQ ATS Analyzer
      - DEBUG=false
      - MAX_UPLOAD_SIZE_BYTES=10485760
    restart: unless-stopped
