services:
  resumeiq:
    build:
      context: .
      dockerfile: Dockerfile
    image: resumeiq:latest
    container_name: resumeiq_app
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=ResumeIQ ATS Analyzer
      - DEBUG=false
      - MAX_UPLOAD_SIZE_BYTES=10485760
      # Optional: Add your Gemini API key here if utilizing Layer B
      # - GEMINI_API_KEY=your_key_here
    restart: unless-stopped
